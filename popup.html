<!doctype html>
<meta charset="utf-8">
<title>Nezvi WoW Extension</title>
<style>
  :root {
    --bg: #101216; --panel: #181b21; --panel-2: #20242c; --line: #2a2f39; --line-2: #3a404c;
    --text: #e9e6df; --muted: #8b8f99; --faint: #5d626c; --guild: #b7a77a;
    --accent: #f2c45a; --accent-2: #b8862b; --on-accent: #1a1408;
    --track: #343944; --knob: #c9ccd3; --knob-on: #fff4d6; --theme-glow: #1d1a12;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    width: 300px; margin: 0; padding: 14px;
    font: 13px/1.4 "Segoe UI", system-ui, sans-serif; color: var(--text);
    --glow: var(--theme-glow);
    background: radial-gradient(120% 60% at 50% 0%, var(--glow) 0%, var(--bg) 60%);
  }
  /* Themes: each one only redefines the palette */
  body[data-theme="arcane"] {
    --bg: #110f1a; --panel: #1a1726; --panel-2: #231f33; --line: #2e2940; --line-2: #403957;
    --text: #ebe6f5; --muted: #958daa; --faint: #625a78; --guild: #b1a2d4;
    --accent: #b794ff; --accent-2: #7a52d6; --on-accent: #170d2c;
    --track: #352f48; --knob: #cdc6dd; --knob-on: #f1e9ff; --theme-glow: #221637;
  }
  body[data-theme="frost"] {
    --bg: #0d1318; --panel: #141c23; --panel-2: #1b2630; --line: #263441; --line-2: #34485a;
    --text: #e3edf2; --muted: #86a0b0; --faint: #557080; --guild: #93b8c9;
    --accent: #7fd4ff; --accent-2: #3a8fc2; --on-accent: #06202e;
    --track: #2b3b48; --knob: #c3d4de; --knob-on: #e6f7ff; --theme-glow: #10273a;
  }
  body[data-theme="fel"] {
    --bg: #0e130f; --panel: #151c16; --panel-2: #1c261d; --line: #283528; --line-2: #374a37;
    --text: #e6efe2; --muted: #8ca088; --faint: #5a6e57; --guild: #a3c393;
    --accent: #8fe36b; --accent-2: #4f9e35; --on-accent: #0e2207;
    --track: #2d3b2c; --knob: #c8d6c3; --knob-on: #ecffe2; --theme-glow: #15290f;
  }
  /* Faction colors */
  body[data-faction="horde"] { --glow: #3a1414; }
  body[data-faction="alliance"] { --glow: #13264a; }

  /* Header */
  /* Grid so the guild line can use the full width under the buttons */
  header { display: grid; grid-template-columns: 34px 1fr auto; column-gap: 10px; align-items: center; margin-bottom: 12px; }
  header .crest { grid-row: 1 / span 2; }
  .crest {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center; font-weight: 700; font-size: 15px;
    color: var(--on-accent); background: linear-gradient(145deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 0 2px var(--panel), 0 2px 10px color-mix(in srgb, var(--accent) 20%, transparent);
  }
  .crest.avatar { color: transparent; background-position: center; background-size: cover; }
  .who { flex: 1; min-width: 0; }
  .who h1 {
    margin: 0; font-size: 15px; font-weight: 600; color: var(--accent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #guildLine { grid-column: 2 / 4; margin: 0; font-size: 11.5px; color: var(--guild); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats { display: flex; gap: 6px; margin: -4px 0 12px; }
  .stat {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; white-space: nowrap;
  }
  .stat b { font-size: 9.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .stat span { font-size: 13px; font-weight: 600; }
  button.stat { font: inherit; color: var(--text); cursor: pointer; transition: border-color .15s, background .15s; }
  button.stat:hover { border-color: var(--line-2); background: var(--panel-2); }
  .stat i { font-style: normal; display: inline-block; transition: transform .2s; }
  .stat.open { border-color: var(--accent-2); }
  .stat.open i { transform: rotate(180deg); }
  /* Best keys panel */
  .runs { margin: -6px 0 12px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .runs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 14px; }
  .run { display: grid; grid-template-columns: 34px 1fr auto; align-items: baseline; font-size: 11.5px; }
  .run .d { color: var(--muted); font-weight: 600; font-size: 10.5px; }
  .run .lvl { font-weight: 600; }
  .run .lvl i { font-style: normal; color: var(--accent); font-size: 9px; margin-left: 2px; }
  .run .muted { color: var(--faint); }
  .run .sc { color: var(--muted); font-size: 11px; }
  .title-cut { margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
  .title-cut b { color: var(--accent); }
  .who p { margin: 0; font-size: 11.5px; color: var(--muted);
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tools { display: flex; gap: 4px; flex: none; }
  .icon {
    width: 28px; height: 28px; display: grid; place-items: center; padding: 0; cursor: pointer;
    color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 7px;
    transition: color .15s, border-color .15s, background .15s;
  }
  .icon:hover { color: var(--text); border-color: var(--line-2); background: var(--panel); }
  .icon.active { color: var(--accent); border-color: var(--accent-2); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .icon svg { width: 15px; height: 15px; }
  #settingsBtn svg { transition: transform .4s; }
  #settingsBtn.active svg { transform: rotate(90deg); }

  /* Form */
  label { display: block; font-size: 11px; color: var(--muted); margin: 8px 0 3px; }
  input, select {
    width: 100%; padding: 7px 9px; font: inherit; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 7px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--faint); }
  input:focus, select:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 13%, transparent); }
  .row { display: grid; grid-template-columns: 70px 1fr; gap: 8px; }
  /* Realm autocomplete */
  .ac { position: relative; }
  .suggest {
    position: absolute; z-index: 10; top: calc(100% + 4px); left: 0; right: 0; margin: 0; padding: 4px;
    list-style: none; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px;
    box-shadow: 0 8px 24px #0009;
  }
  .suggest li { padding: 6px 8px; border-radius: 5px; cursor: pointer; }
  .suggest li:hover, .suggest li.on { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
  .primary {
    width: 100%; margin-top: 12px; padding: 8px; border: 0; border-radius: 7px; cursor: pointer;
    font: inherit; font-weight: 600; color: var(--on-accent);
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
  }
  .primary:hover { filter: brightness(1.08); }
  .secondary {
    width: 100%; margin-top: 8px; padding: 7px; border-radius: 7px; cursor: pointer;
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    transition: background .15s, border-color .15s;
  }
  .secondary:hover { background: var(--panel-2); border-color: var(--line-2); }
  .error { color: #ff8a80; font-size: 11.5px; margin: 6px 0 0; min-height: 1em; }
  /* Player lookup */
  .lookup { position: relative; margin: 0 0 12px; }
  .lookup svg { position: absolute; left: 10px; top: 9px; width: 14px; height: 14px; color: var(--muted); pointer-events: none; }
  .lookup input { padding-left: 31px; }
  .lookup input::placeholder { font-size: 12px; }
  .lookup-error { color: #ff8a80; font-size: 11px; margin: 4px 2px 0; }
  .recent { margin-top: 6px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .recent-head { display: flex; justify-content: space-between; align-items: center; padding: 2px 6px 4px;
                 font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .recent-head button { font: inherit; text-transform: none; letter-spacing: 0; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 0; }
  .recent-head button:hover { color: var(--accent); }
  .recent-item {
    display: flex; width: 100%; justify-content: space-between; align-items: baseline; gap: 8px; padding: 5px 6px;
    font: inherit; color: var(--text); background: none; border: 0; border-radius: 5px; cursor: pointer; text-align: left;
  }
  .recent-item:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
  .recent-item small { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--muted); text-align: center; padding: 14px 0; margin: 0; }

  /* Links */
  .section { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
             color: var(--muted); margin: 12px 2px 6px; }
  .section:first-child { margin-top: 0; }
  .link {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin: 5px 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); text-decoration: none; transition: background .15s, border-color .15s, transform .15s;
  }
  .link:hover { background: var(--panel-2); border-color: var(--line-2); transform: translateX(2px); }
  .tag {
    flex: none; width: 34px; padding: 3px 0; border-radius: 5px; text-align: center;
    font-size: 10px; font-weight: 700; color: #fff;
  }
  .link .name { flex: 1; }
  .link kbd {
    font-family: inherit; font-size: 10.5px; line-height: 1; color: var(--muted); padding: 3px 6px;
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; transition: color .15s, border-color .15s;
  }
  .link:hover kbd { color: var(--accent); border-color: var(--accent-2); }
  .no-kbd .link kbd { display: none; }
  /* Compact mode: colored tags in a grid, names in the tooltip */
  #links.compact { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #links.compact .section { grid-column: 1 / -1; margin: 6px 2px 0; }
  #links.compact .section:first-child { margin-top: 0; }
  #links.compact .empty { grid-column: 1 / -1; }
  #links.compact .link { position: relative; justify-content: center; margin: 0; padding: 11px 4px; }
  #links.compact .link:hover { transform: translateY(-1px); }
  #links.compact .tag { width: 40px; font-size: 11px; padding: 4px 0; }
  #links.compact .name { display: none; }
  #links.compact kbd { position: absolute; top: 4px; right: 5px; padding: 0; border: 0; font-size: 9.5px; }

  /* Options */
  .seg { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; gap: 3px;
         background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .seg button {
    padding: 6px; border: 0; border-radius: 6px; cursor: pointer; font: inherit;
    color: var(--muted); background: transparent; transition: background .15s, color .15s;
  }
  .seg button:hover { color: var(--text); }
  .seg button.on { color: var(--on-accent); font-weight: 600; background: linear-gradient(180deg, var(--accent), var(--accent-2)); }
  .themes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .themes button {
    display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 2px 6px; cursor: pointer;
    font: inherit; font-size: 11px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    transition: border-color .15s, color .15s;
  }
  .themes button:hover { color: var(--text); border-color: var(--line-2); }
  .themes button.on { color: var(--text); border-color: var(--accent-2); }
  .themes i { width: 18px; height: 18px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--c); }
  .opt {
    display: flex; align-items: center; gap: 10px; margin: 0; padding: 7px 10px; cursor: pointer;
    font-size: 13px; color: var(--text); border-bottom: 1px solid var(--line);
  }
  .opts { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .opts .opt:last-child { border-bottom: 0; }
  .opt:hover { background: var(--panel-2); }
  .opt .txt { flex: 1; }
  .opt small { color: var(--muted); font-size: 11px; }
  /* Toggle switch */
  .switch { position: relative; flex: none; width: 30px; height: 17px; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .switch span {
    position: absolute; inset: 0; border-radius: 999px; background: var(--track); transition: background .15s;
  }
  .switch span::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%;
    background: var(--knob); transition: transform .15s, background .15s;
  }
  .switch input:checked + span { background: var(--accent-2); }
  .switch input:checked + span::after { transform: translateX(13px); background: var(--knob-on); }
  .switch input:focus-visible + span { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 27%, transparent); }

  /* Footer */
  footer {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--muted);
  }
  .donate {
    flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
    color: var(--accent); text-decoration: none; font-weight: 600;
    border: 1px solid color-mix(in srgb, var(--accent) 33%, transparent); background: color-mix(in srgb, var(--accent) 7%, transparent); transition: background .15s, border-color .15s;
  }
  .donate:hover { background: color-mix(in srgb, var(--accent) 15%, transparent); border-color: var(--accent); }
  .donate .heart { color: #ff6b6b; }
</style>

<header>
  <div class="crest" id="crest">N</div>
  <div class="who">
    <h1 id="title">Nezvi WoW</h1>
    <p id="subtitle"></p>
  </div>
  <div class="tools">
    <button class="icon" id="searchBtn" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <button class="icon" id="copy" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
    </button>
    <button class="icon" id="edit" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
    <button class="icon" id="settingsBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    </button>
  </div>
  <p id="guildLine" hidden></p>
</header>
<div class="lookup" id="lookup" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="lookupInput" data-i18n-ph="lookupPh" autocomplete="off" spellcheck="false">
  <p class="lookup-error" id="lookupError" hidden></p>
  <div class="recent" id="recent" hidden></div>
</div>
<div class="stats" id="stats" hidden></div>
<div class="runs" id="runs" hidden></div>

<!-- View: character setup -->
<div id="config" hidden>
  <div class="row">
    <div>
      <label for="region" data-i18n="region"></label>
      <select id="region"><option>us</option><option>eu</option><option>kr</option><option>tw</option></select>
    </div>
    <div>
      <label for="realm" data-i18n="realm"></label>
      <div class="ac">
        <input id="realm" data-i18n-ph="realmPh" autocomplete="off">
        <ul class="suggest" id="realmSuggest" hidden></ul>
      </div>
    </div>
  </div>
  <label for="name" data-i18n="name"></label>
  <input id="name" data-i18n-ph="namePh">
  <button class="primary" id="save" data-i18n="save"></button>
  <button class="secondary" id="removeChar" data-i18n="removeChar" hidden></button>
  <p class="error" id="error"></p>
</div>

<!-- View: links -->
<div id="linksView" hidden>
  <div id="links"></div>
</div>

<!-- View: options -->
<div id="settings" hidden>
  <div class="section" data-i18n="language"></div>
  <div class="seg" id="lang">
    <button data-lang="es">Español</button>
    <button data-lang="en">English</button>
  </div>
  <div class="section" data-i18n="theme"></div>
  <div class="themes" id="themes">
    <button data-theme="gold"><i style="--c:#f2c45a"></i><span data-i18n="themeGold"></span></button>
    <button data-theme="arcane"><i style="--c:#b794ff"></i><span data-i18n="themeArcane"></span></button>
    <button data-theme="frost"><i style="--c:#7fd4ff"></i><span data-i18n="themeFrost"></span></button>
    <button data-theme="fel"><i style="--c:#8fe36b"></i><span data-i18n="themeFel"></span></button>
  </div>
  <div class="section" data-i18n="charLinks"></div>
  <div class="opts" id="charOpts"></div>
  <div class="section" data-i18n="guildLinks"></div>
  <div class="opts" id="guildOpts"></div>
  <div class="section" data-i18n="prefs"></div>
  <div class="opts">
    <label class="opt"><span class="txt" data-i18n="background"></span>
      <span class="switch"><input type="checkbox" id="background"><span></span></span></label>
    <label class="opt"><span class="txt" data-i18n="shortcuts"></span>
      <span class="switch"><input type="checkbox" id="shortcuts"><span></span></span></label>
    <label class="opt"><span class="txt" data-i18n="compact"></span>
      <span class="switch"><input type="checkbox" id="compact"><span></span></span></label>
    <label class="opt"><span class="txt" data-i18n="faction"></span>
      <span class="switch"><input type="checkbox" id="faction"><span></span></span></label>
  </div>
  <button class="primary" id="done" data-i18n="done"></button>
  <button class="secondary" id="reset" data-i18n="reset"></button>
</div>

<footer>
  <span id="hint"></span>
  <a class="donate" id="donate" target="_blank"><span class="heart">♥</span> <span data-i18n="donate"></span></a>
</footer>
<script src="realms.js"></script>
<script src="raiderio.js"></script>
<script src="popup.js"></script>
